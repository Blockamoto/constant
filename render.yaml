services:
  - type: web
    name: constant
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONSTANT_ADMIN_PASSWORD
        sync: false
      - key: CONSTANT_SESSION_SECRET
        generateValue: true
